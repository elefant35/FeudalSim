# yaml-language-server: $schema=../schemas/disease.schema.json
# 11 §7.1–7.2 diseases and §8.1 toxins (M2-07a). Toxins are single-course "diseases" entered by eating: the onset is the
# incubation, the course one stage, the untreated CFR the grave branch (dose scaling and emetics: M2-07b and treatment).
# Effects: hydration_decay / satiety_absorb multiply needs, work multiplies work rate, condition_load × 50 is the Health
# load (11 §4.1 ConditionLoad).
- id: disease.flux
  name: the Flux
  routes: [water, food, contact]
  incubation_h: [8, 16]
  beta: 0.005
  stages:
    - { id: onset,    hours: [6, 12],  contagious: 0.5, fever: true, effects: { hydration_decay: 2.0, work: 0.6 } }
    - { id: acute,    hours: [18, 36], contagious: 1.0, fever: true, grave: true, effects: { hydration_decay: 3.0, satiety_absorb: 0.5, work: 0.2, condition_load: 0.4 } }
    - { id: recovery, hours: [12, 24], contagious: 0.3, effects: { work: 0.8 } }
  grave: { base: 0.02, mult: { child: 3, elder: 2.5, malnourished: 2, starving: 4 } }
  immunity_days: 4
- id: disease.food_poisoning
  name: Food poisoning
  routes: [food]
  incubation_h: [2, 6]
  stages:
    - { id: sick, hours: [6, 12], grave: true, effects: { hydration_decay: 1.5, work: 0.5, condition_load: 0.2 } }
  grave: { base: 0.005, mult: { adult: 0 } }   # ≈ 0 for adults, 0.5% for children and elders
- id: disease.toxin_death_cap
  name: Death-cap poisoning
  routes: [food]
  incubation_h: [8, 12]
  stages:
    - { id: liver_failure, hours: [24, 48], grave: true, effects: { work: 0.1, condition_load: 0.8 } }
  grave: { base: 0.40 }
- id: disease.toxin_hemlock
  name: Hemlock poisoning
  routes: [food]
  incubation_h: [0.5, 2]
  stages:
    - { id: seizures, hours: [2, 6], grave: true, effects: { work: 0.0, condition_load: 0.9 } }
  grave: { base: 0.50 }
- id: disease.toxin_water_hemlock
  name: Water-hemlock poisoning
  routes: [food]
  incubation_h: [0.5, 2]
  stages:
    - { id: seizures, hours: [2, 6], grave: true, effects: { work: 0.0, condition_load: 0.9 } }
  grave: { base: 0.70 }
- id: disease.toxin_nightshade
  name: Nightshade poisoning
  routes: [food]
  incubation_h: [1, 3]
  stages:
    - { id: delirium, hours: [6, 12], grave: true, effects: { work: 0.2, condition_load: 0.5 } }
  grave: { base: 0.15, mult: { child: 2.67 } }
- id: disease.toxin_foxglove
  name: Foxglove poisoning
  routes: [food]
  incubation_h: [2, 6]
  stages:
    - { id: heart, hours: [6, 12], grave: true, effects: { work: 0.2, condition_load: 0.6 } }
  grave: { base: 0.20 }
- id: disease.toxin_lily_of_the_valley
  name: Lily-of-the-valley poisoning
  routes: [food]
  incubation_h: [1, 2]
  stages:
    - { id: heart, hours: [6, 12], grave: true, effects: { work: 0.3, condition_load: 0.5 } }
  grave: { base: 0.10 }
