# yaml-language-server: $schema=../schemas/asset.schema.json
# Original procedural P0.3 terrain; packed-channel measurements in art/generators/terrain/review/checks.json.
- id: asset.terrain.sand
  kind: texture
  status: review
  milestone: M2
  source:
    type: generator
    generator: art/generators/terrain/terrain.py
    params: { layer: sand, seed: 3101, size: 1024, tile_m: 2 }
    tool: Python 3 with NumPy and Pillow
  outputs: [game/assets/terrain/sand_albedo_height.png, game/assets/terrain/sand_normal_rough.png]
  measured: {}
  license: { name: Proprietary-own-work, author: FeudalSim, attribution_required: false }
  notes: "P0.3; two tileable 1024x1024 RGBA maps over 2m. RGB albedo/A height; OpenGL RGB normal/A roughness. Relief 0.018m. Palette-derived sand, soil. Texture checker and tiled previews pass; owner look review pending."
