- id: asset.wreck.hull_bow
  kind: model
  status: review
  milestone: M2
  source:
    type: generator
    generator: art/generators/wreck/wreck.py
    params: { item: hull_bow, seed: 700 }
    tool: Blender 5.1.0 (headless)
  outputs: [game/assets/wreck/hull_bow.glb]
  budget_class: building_medium
  measured: { tris_lod0: 3252, materials: 1 }
  license: { name: Proprietary-own-work, author: FeudalSim, attribution_required: false }
  notes: "Clinker planks overlap with solid lap edges, damaged amidships ends, exposed frames, incomplete deck, keel, stem and forward mast stump. 25 degree baked port heel. Waterline z=0, not ground. Hull and deck share hollow triangle collision. Place local origin at y=-5.5 relative to ship centre; together with stern gives approximately22m hull. Turntable and40m silhouette inspected; original procedural geometry using the shared palette."
