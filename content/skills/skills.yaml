# The 28 canonical skills (canon §10.2). Rules per skill: docs/design/12-skills-and-professions.md §4.
# Land
- { id: skill.farming,       name: Farming,       domain: land,         description: "Tilling, sowing, tending and harvesting fields.", attributes: { end: 0.4, per: 0.3, str: 0.3 } }
- { id: skill.husbandry,     name: Husbandry,     domain: land,         description: "Herding, feeding, breeding, milking and shearing animals.", attributes: { per: 0.4, end: 0.3, cha: 0.3 } }
- { id: skill.foraging,      name: Foraging,      domain: land,         description: "Finding and identifying wild plants, herbs, fungi and berries.", attributes: { per: 0.6, int: 0.2, end: 0.2 } }
- { id: skill.hunting,       name: Hunting,       domain: land,         description: "Tracking, stalking, trapping, the kill and field dressing.", attributes: { per: 0.5, end: 0.3, dex: 0.2 } }
- { id: skill.fishing,       name: Fishing,       domain: land,         description: "Lines, nets and weirs.", attributes: { per: 0.4, dex: 0.3, end: 0.3 } }
- { id: skill.woodcutting,   name: Woodcutting,   domain: land,         description: "Felling, limbing, splitting and charcoal burning.", attributes: { str: 0.5, end: 0.4, per: 0.1 } }
- { id: skill.mining,        name: Mining,        domain: land,         description: "Prospecting, quarrying and ore extraction.", attributes: { str: 0.5, end: 0.3, per: 0.2 } }
