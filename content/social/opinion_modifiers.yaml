# yaml-language-server: $schema=../schemas/opinion_modifier.schema.json
# Opinion modifier catalog (16 §4.5; M1 scope: #1–39 and the rapport pair #58–59). Values are pre-scaling (16 §4.4).
# stacking: add (cap) · saturate (cap, asymptotic) · refresh · once. floor_fraction leaves a permanent residue.
# public_multiplier applies when ≥ 3 witnesses (status-relevant harms). scaling: honor (× 0.5 + Honor/100) or
# family_faith (× 0.5 + value/100). fear: event fear added toward the actor (16 §4.10). Variable values (gift, request
# importance, stakes, severity, first impression, amends) are passed by the triggering system as a multiplier.
