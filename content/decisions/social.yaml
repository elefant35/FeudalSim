# yaml-language-server: $schema=../schemas/dp.schema.json
# Social decision points in conversations with the player (16 §4.14, §4.15, §5.4, §7.10). The owners compute base
# propensities from 16's formulas and 22 §6.3's menu width; options carry no extra character terms here.
- id: dp.rapport
  owner: 16.rapport
  description: >-
    16 §4.15 — how the NPC feels about the talk: once at the close of a conversation with the player (and after every 8
    further turns, at most 3), ±step Opinion with step 1–4 from Familiarity. warm_to_speaker needs words budget left.
  options:
    - { id: warm_to_speaker, family: rapport, stakes: low, favors_player: true, gloss: "warm to {player} a little after this talk" }
    - { id: stay_neutral,    family: rapport, stakes: low, gloss: "feel no differently about {player}" }
    - { id: cool_to_speaker, family: rapport, stakes: low, gloss: "cool on {player} a little after this talk" }
- id: dp.apology
  owner: 16.apology
  description: >-
    16 §4.14 — the wronged person's answer to an apology. demand_amends needs a material harm (theft, damage, cheating:
    M3–M4); in M1 the choice is accept or refuse.
  options:
    - { id: accept_apology,  family: accept, stakes: low, favors_player: true, gloss: "accept {player}'s apology" }
    - { id: demand_amends,   family: counter, stakes: low, gloss: "demand that {player} make it right first" }
    - { id: refuse_apology,  family: refuse, stakes: low, gloss: "refuse {player}'s apology" }
- id: dp.request
  owner: 16.request
  description: >-
    16 §5.4 — a favor asked in conversation: help at a camp task for some hours (M1). The yes propensity is Willingness with
    22 §6.3's menu width; repeats the same day halve it. Accepted favors are carried out by the utility AI as obligations.
  options:
    - { id: accept_request,        family: accept, stakes: low, favors_player: true, gloss: "agree to help {player} with {task} for {hours} hour(s)" }
    - { id: accept_with_condition, family: accept, stakes: low, favors_player: true, gloss: "help with {task} if {player} returns the favor with equal hours" }
    - { id: defer,                 family: counter, stakes: low, gloss: "promise to help with {task} tomorrow, not now" }
    - { id: refuse_request,        family: refuse, stakes: low, gloss: "refuse to help {player} with {task}" }
- id: dp.told
  owner: 16.told
  description: >-
    16 §7.10 — being told a claim by the player. A detected lie (the §5.2 lie test) is an act and opens no DP.
  options:
    - { id: believe,    family: believe, stakes: low, favors_player: true, gloss: "believe {player}: {claim}" }
    - { id: doubt,      family: doubt,   stakes: low, gloss: "doubt what {player} says ({claim})" }
    - { id: repeat,     family: believe, stakes: low, favors_player: true, gloss: "believe it and pass it on: {claim}" }
    - { id: keep_quiet, family: believe, stakes: low, gloss: "believe it but keep it to yourself: {claim}" }
