name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      LLM_MODE: template          # CI never calls a model: the policy decides, templates speak
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json   # SDK 10 (ADR-0010)

      - name: Restore
        run: dotnet restore FeudalSim.sln

      - name: Build (warnings are errors)
        run: dotnet build FeudalSim.sln --no-restore -c Release

      - name: Test
        run: dotnet test --solution FeudalSim.sln --no-build -c Release --report-xunit-trx --results-directory TestResults

      - name: Content — validate
        run: dotnet run --project src/FeudalSim.Headless --no-build -c Release -- content validate

      - name: Content — schemas are fresh
        run: dotnet run --project src/FeudalSim.Headless --no-build -c Release -- content schemas --check

      - name: Content — asset licenses are fresh
        run: dotnet run --project src/FeudalSim.Headless --no-build -c Release -- content licenses --check

      - name: Headless smoke run (determinism, 1 vs 4 threads)
        run: dotnet run --project src/FeudalSim.Headless --no-build -c Release -- run --scenario content/scenarios/m0_smoke.yaml --threads 4 --verify-determinism

      - name: Camp sweep — 21 §19 metrics in band (20 seeds × 30 days; the nightly protocol is 100)
        run: dotnet run --project src/FeudalSim.Headless --no-build -c Release -- sweep --scenario content/scenarios/m1_camp.yaml --seeds 20 --days 30

      - name: Headless social sim — 30 days, no deadlocks, disputes emerge (M1-22)
        run: dotnet run --project src/FeudalSim.Headless --no-build -c Release -- social --seeds 10 --days 30

      - name: "Knapping calibration (12 §6.5, 13 §13.3, M2-11a): curves current, attentive m matches the NPC logistic"
        run: dotnet run --project src/FeudalSim.Headless --no-build -c Release -- minigame --check --samples 2000

      - name: "Weather chain (10 §6.3, M2-03): shares within 3 points over 3,000 years"
        run: dotnet run --project src/FeudalSim.Headless --no-build -c Release -- weather

      - name: World generation (10 §3, M2-01) — 20 seeds meet the asserts
        run: dotnet run --project src/FeudalSim.Headless --no-build -c Release -- worldgen --seeds 20

      - name: Template-mode completability (22 §13.3; the policy decides every DP, 10 worlds)
        run: dotnet run --project src/FeudalSim.Headless --no-build -c Release -- complete --seeds 10

      - name: Upload test results and smoke run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-${{ matrix.os }}
          path: |
            TestResults/
            sim_runs/
          if-no-files-found: ignore
